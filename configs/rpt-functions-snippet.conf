;;;;; AutoNet Automations ;;;;;
; Place these inside the active functions stanza (usually [functions-main])
; Adjust sound file names to match your announcements

901 = playback,/usr/local/share/asterisk/sounds/herzog-10m          ; 10-minute warning
902 = playback,/usr/local/share/asterisk/sounds/herzog-5m           ; 5-minute warning
903 = playback,/usr/local/share/asterisk/sounds/herzog-now          ; Pre-net announcement
806 = ilink,6                                                       ; Disconnect all links (remembers them) [This might already be uncommented]
816 = ilink,16                                                      ; Reconnect previously disconnected links [This might already be uncommented]

; Optional enable/disable via DTMF (requires working cmd, support)
; 86 = cmd,/bin/bash /etc/asterisk/scripts/autonet.sh
